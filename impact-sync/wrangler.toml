name = "impact-sync"
main = "src/index.js"
compatibility_date = "2026-08-25"

# Safety-margin refresh; the primary refresh path is the manual "POST /sync" trigger
# a maintainer calls right after updating the spreadsheet each quarter.
[triggers]
crons = ["0 6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "langtech-impact"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

name = "languagetechnology-org"
pages_build_output_dir = "."
compatibility_date = "2026-08-25"

# Same namespace as impact-sync/wrangler.toml (that worker writes, this Pages project
# only reads). Shared across every /impact data source (products, fonts, ...), each
# under its own key prefix -- see functions/impact/api/*.js. Fill in the real id
# after running:
#   wrangler kv namespace create langtech-impact
[[kv_namespaces]]
binding = "IMPACT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
